name: Playwright Regression Tests

on:
  push:
    branches: [qa-playwright, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Regression and QA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        id: deps
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        id: browser
        run: npx playwright install --with-deps chromium

      - name: Run existing Smoke Test
        run: npm test

      - name: Run Regression and QA Framework v1
        if: >-
          ${{
            !cancelled() &&
            steps.deps.outcome == 'success' &&
            steps.browser.outcome == 'success'
          }}
        run: npm run qa:v1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-qa-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
            qa/reports/QA_Report.html
            qa/reports/results.json
            qa/reports/source-audit.json
            qa/reports/release-gate.json
            qa/reports/mutations.json
            qa/reports/Coverage_Matrix.csv
            qa/reports/target-environment.json
            qa/reports/pipeline.json
          retention-days: 14
          if-no-files-found: warn
